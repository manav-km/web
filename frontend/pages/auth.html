  <main id="main-content">
    <header class="page-hero">
      <h1 class="page-hero__title" id="auth-heading">CREATE ACCOUNT</h1>
      <p class="page-hero__subtitle" id="auth-subheading">Create your client account to start a project, discuss requirements, and track milestones.</p>
    </header>

    <section class="container" style="max-width: 760px; margin-bottom: var(--space-24);">
      <!-- Card Container for Auth -->
      <div class="card" style="padding: var(--space-8);">
        <!-- Active Session Banner (shown only if a session is currently active) -->
        <div id="auth-current-session" style="display: none; background: var(--bg-surface); border: 1px solid var(--border-hairline); border-radius: var(--radius-md); padding: var(--space-3) var(--space-4); margin-bottom: var(--space-6); align-items: center; justify-content: space-between; gap: var(--space-3); flex-wrap: wrap;">
          <span style="font-size: var(--fs-small); color: var(--fg-secondary);">
            Signed in as <strong id="session-user-email" style="color: var(--fg-primary);"></strong>
          </span>
          <div style="display: flex; gap: var(--space-2); align-items: center;">
            <a class="btn btn--ghost btn--sm" href="/frontend/pages/connect.html" data-cursor-hover>Go to Connect</a>
            <button id="btn-session-signout" class="btn btn--danger btn--sm" type="button" data-cursor-hover>Sign Out</button>
          </div>
        </div>

        <!-- Social OAuth Sign-In (Google, Apple, Microsoft) -->
        <div class="oauth-grid">
          <button id="auth-google" class="btn btn--ghost oauth-btn" type="button" data-cursor-hover>
            <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.7l3.1-3.1C17.3 1.8 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.4 9 5 12 5z"/>
              <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/>
              <path fill="#FBBC05" d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.3s.1-1.6.4-2.3L1.9 7.3C.7 9.7 0 12 0 12s.7 2.3 1.9 4.7l3.7-1.9z"/>
              <path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2-6.4-4.8L1.9 16.7C3.7 20.4 7.5 23 12 23z"/>
            </svg>
            <span>Google</span>
          </button>

          <button id="auth-apple" class="btn btn--ghost oauth-btn" type="button" data-cursor-hover>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.38c.62-.75 1.04-1.8 0.93-2.85-.9.04-1.98.6-2.61 1.34-.56.64-1.04 1.71-.91 2.74 1.01.08 2.03-.51 2.59-1.23z"/>
            </svg>
            <span>Apple</span>
          </button>

          <button id="auth-microsoft" class="btn btn--ghost oauth-btn" type="button" data-cursor-hover>
            <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="#F25022" d="M1 1h10v10H1z"/>
              <path fill="#7FBA00" d="M13 1h10v10H13z"/>
              <path fill="#00A4EF" d="M1 13h10v10H1z"/>
              <path fill="#FFB900" d="M13 13h10v10H13z"/>
            </svg>
            <span>Microsoft</span>
          </button>
        </div>

        <!-- OR Divider -->
        <div class="auth-divider">
          <div class="auth-divider__line"></div>
          <span class="auth-divider__text">OR</span>
          <div class="auth-divider__line"></div>
        </div>

        <!-- Mode Switcher Tabs -->
        <div class="filters" style="margin-bottom: var(--space-6); justify-content: stretch; display: grid; grid-template-columns: 1fr 1fr; max-width: 380px; margin-inline: auto;">
          <button id="tab-signin" class="filter" type="button" aria-pressed="false" style="text-align: center; border-radius: var(--radius-sm);" data-cursor-hover>Sign In</button>
          <button id="tab-signup" class="filter" type="button" aria-pressed="true" style="text-align: center; border-radius: var(--radius-sm);" data-cursor-hover>Create Account</button>
        </div>

        <div id="auth-alert" role="alert" style="margin-bottom: var(--space-4);"></div>

        <form id="auth-form" class="form form--full" novalidate>
          <!-- ==================== [Box 1 Start] Personal Info ==================== -->
          <div id="box-personal" class="auth-box">
            <h3 class="auth-box__title">Personal Info</h3>

            <!-- Row 1: Full Legal name & Address -->
            <div class="form__row" id="row-personal-1">
              <div class="field" id="col-name">
                <label for="auth-name">Full Legal Name *</label>
                <input id="auth-name" type="text" autocomplete="name" placeholder="John Doe" />
              </div>
              <div class="field" id="col-address">
                <label for="auth-address">Address *</label>
                <input id="auth-address" type="text" autocomplete="street-address" placeholder="City, State, Country" />
              </div>
            </div>

            <!-- Row 2: E-Mail & Phone -->
            <div class="form__row" id="row-personal-2" style="margin-top: var(--space-4);">
              <div class="field" id="col-email">
                <label for="auth-email">E-Mail *</label>
                <input id="auth-email" type="email" autocomplete="email" required placeholder="name@example.com" />
              </div>
              <div class="field" id="col-phone">
                <label for="auth-phone">Phone *</label>
                <input id="auth-phone" type="tel" autocomplete="tel" placeholder="+1 (555) 000-0000" />
              </div>
            </div>

            <!-- Row 3: Password & Confirm Password -->
            <div class="form__row" id="row-personal-3" style="margin-top: var(--space-4);">
              <div class="field" id="col-pass">
                <label for="auth-pass">Password *</label>
                <input id="auth-pass" type="password" autocomplete="new-password" required minlength="8" placeholder="At least 8 characters" />
              </div>
              <div class="field" id="col-pass-confirm">
                <label for="auth-pass-confirm">Confirm Password *</label>
                <input id="auth-pass-confirm" type="password" autocomplete="new-password" minlength="8" placeholder="Re-enter password" />
              </div>
            </div>
          </div>
          <!-- ==================== [Box 1 End] ==================== -->

          <!-- ==================== [Box 2 Start] Business Info ==================== -->
          <div id="box-business" class="auth-box">
            <h3 class="auth-box__title">Business Info</h3>

            <!-- Row 1: Organisation & Postal Address -->
            <div class="form__row">
              <div class="field">
                <label for="auth-business-org">Organisation</label>
                <input id="auth-business-org" type="text" autocomplete="organization" placeholder="Company or organization" />
              </div>
              <div class="field">
                <label for="auth-business-address">Postal Address</label>
                <input id="auth-business-address" type="text" placeholder="Office / postal address" />
              </div>
            </div>

            <!-- Row 2: E-Mail & Phone -->
            <div class="form__row" style="margin-top: var(--space-4);">
              <div class="field">
                <label for="auth-business-email">E-Mail</label>
                <input id="auth-business-email" type="email" placeholder="work@company.com" />
              </div>
              <div class="field">
                <label for="auth-business-phone">Phone</label>
                <input id="auth-business-phone" type="tel" placeholder="Business phone number" />
              </div>
            </div>

            <!-- Row 3: Type & Designation -->
            <div class="form__row" style="margin-top: var(--space-4);">
              <div class="field">
                <label for="auth-business-type">Type</label>
                <input id="auth-business-type" type="text" placeholder="e.g. Startup, Agency, Enterprise" />
              </div>
              <div class="field">
                <label for="auth-business-designation">Designation</label>
                <input id="auth-business-designation" type="text" placeholder="e.g. Founder, CEO, Director" />
              </div>
            </div>
          </div>
          <!-- ==================== [Box 2 End] ==================== -->

          <!-- ==================== [Box 3 Start] Legal and Privacy Info ==================== -->
          <div id="box-legal" class="auth-box">
            <h3 class="auth-box__title">Legal and Privacy Info</h3>

            <!-- Date of Birth -->
            <div class="field" style="max-width: 320px;">
              <label for="auth-dob">Date of Birth *</label>
              <input id="auth-dob" type="date" />
            </div>

            <!-- Confirm you are over 18 -->
            <div class="field field--check" style="margin-top: var(--space-4);">
              <input id="auth-age" type="checkbox" />
              <label for="auth-age">Confirm you are over 18 *</label>
            </div>

            <!-- Confirm you agree to our Privacy Policy -->
            <div class="field field--check" style="margin-top: var(--space-3);">
              <input id="auth-priv" type="checkbox" />
              <label for="auth-priv">Confirm you agree to our <a href="/frontend/pages/legal.html" target="_blank" style="text-decoration: underline;">Privacy Policy &amp; Terms</a> *</label>
            </div>

            <!-- Cloudflare bot prevention Check -->
            <div style="margin-top: var(--space-5);">
              <label style="font-size: var(--fs-small); color: var(--fg-secondary); display: block; margin-bottom: var(--space-2);">Cloudflare bot prevention Check</label>
              <div id="auth-turnstile" class="cf-turnstile"></div>
            </div>
          </div>
          <!-- ==================== [Box 3 End] ==================== -->

          <!-- [Reset Button]  [Sign Up Button] -->
          <div id="auth-actions" style="display: flex; gap: var(--space-4); justify-content: flex-end; align-items: center; margin-top: var(--space-2);">
            <button id="auth-reset" class="btn btn--ghost" type="reset" data-cursor-hover>Reset</button>
            <button id="auth-submit" class="btn btn--primary" type="submit" data-cursor-hover>Sign Up</button>
          </div>

          <!-- Forgot Password Link -->
          <div id="auth-forgot-wrap" style="text-align: center; margin-top: var(--space-3); display: none;">
            <button id="auth-forgot" class="link-btn" type="button" style="border: none; background: none; cursor: pointer;" data-cursor-hover>
              Forgot your password?
            </button>
          </div>
        </form>
      </div>
    </section>
