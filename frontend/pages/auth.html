  <main id="main-content">
    <header class="page-hero">
      <h1 class="page-hero__title" id="auth-heading">ACCOUNT ACCESS</h1>
      <p class="page-hero__subtitle" id="auth-subheading">Sign in to your account or create a new one to access the client portal.</p>
    </header>

    <section class="container" style="max-width: 520px; margin-bottom: var(--space-24);">
      <!-- Card Container for Auth -->
      <div class="card" style="padding: var(--space-8);">
        <!-- Mode Switcher Tabs -->
        <div class="filters" style="margin-bottom: var(--space-6); justify-content: stretch; display: grid; grid-template-columns: 1fr 1fr;">
          <button id="tab-signin" class="filter" type="button" aria-pressed="false" style="text-align: center; border-radius: var(--radius-sm);" data-cursor-hover>Sign In</button>
          <button id="tab-signup" class="filter" type="button" aria-pressed="true" style="text-align: center; border-radius: var(--radius-sm);" data-cursor-hover>Create Account</button>
        </div>

        <div id="auth-alert" role="alert" style="margin-bottom: var(--space-4);"></div>

        <form id="auth-form" class="form form--full" novalidate>
          <!-- Full Name (Sign Up only) -->
          <div id="row-name" class="field">
            <label for="auth-name">Full Name *</label>
            <input id="auth-name" type="text" autocomplete="name" placeholder="Your Full Name" />
          </div>

          <!-- Email -->
          <div class="field">
            <label for="auth-email">Email Address *</label>
            <input id="auth-email" type="email" autocomplete="email" required placeholder="name@example.com" />
          </div>

          <!-- Password -->
          <div class="field">
            <label for="auth-pass">Password *</label>
            <input id="auth-pass" type="password" autocomplete="new-password" required minlength="8" placeholder="At least 8 characters" />
          </div>

          <!-- Additional Profile Details (Sign Up only) -->
          <div id="row-details-1" class="form__row" style="margin-top: var(--space-2);">
            <div class="field">
              <label for="auth-phone">Phone Number</label>
              <input id="auth-phone" type="tel" autocomplete="tel" placeholder="+1 (555) 000-0000" />
            </div>
            <div class="field">
              <label for="auth-country">Country / Region</label>
              <input id="auth-country" type="text" autocomplete="country-name" placeholder="e.g. India, United States" />
            </div>
          </div>

          <div id="row-details-2" class="form__row">
            <div class="field">
              <label for="auth-profession">Profession / Title</label>
              <input id="auth-profession" type="text" placeholder="e.g. Product Manager, Founder" />
            </div>
            <div class="field">
              <label for="auth-business">Company / Business</label>
              <input id="auth-business" type="text" placeholder="Your organization (optional)" />
            </div>
          </div>

          <!-- Age confirmation (Sign Up only) -->
          <div id="row-age" class="field field--check" style="margin-top: var(--space-2);">
            <input id="auth-age" type="checkbox" />
            <label for="auth-age">I confirm I am 18 years of age or older *</label>
          </div>

          <!-- Terms acceptance (Sign Up only) -->
          <div id="row-priv" class="field field--check">
            <input id="auth-priv" type="checkbox" />
            <label for="auth-priv">I have read and accept the <a href="/frontend/pages/legal.html" target="_blank" style="text-decoration: underline;">Terms &amp; Conditions</a> *</label>
          </div>

          <!-- Submit Button -->
          <button id="auth-submit" class="btn btn--primary" type="submit" style="width: 100%; justify-content: center; margin-top: var(--space-4);" data-cursor-hover>
            Create Account
          </button>

          <!-- Divider -->
          <div style="display: flex; align-items: center; gap: var(--space-4); margin: var(--space-4) 0;">
            <div style="flex: 1; height: 1px; background: var(--border-hairline);"></div>
            <span style="font-size: var(--fs-micro); color: var(--fg-muted); text-transform: uppercase;">or</span>
            <div style="flex: 1; height: 1px; background: var(--border-hairline);"></div>
          </div>

          <!-- Google Auth Button -->
          <button id="auth-google" class="btn btn--ghost" type="button" style="width: 100%; justify-content: center; display: inline-flex; align-items: center;" data-cursor-hover>
            <svg width="18" height="18" viewBox="0 0 24 24" style="margin-right: 10px;" aria-hidden="true">
              <path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.7l3.1-3.1C17.3 1.8 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.4 9 5 12 5z"/>
              <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/>
              <path fill="#FBBC05" d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.3s.1-1.6.4-2.3L1.9 7.3C.7 9.7 0 12 0 12s.7 2.3 1.9 4.7l3.7-1.9z"/>
              <path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2-6.4-4.8L1.9 16.7C3.7 20.4 7.5 23 12 23z"/>
            </svg>
            Continue with Google
          </button>

          <!-- Forgot Password Link -->
          <button id="auth-forgot" class="link-btn" type="button" style="text-align: center; margin-top: var(--space-3); border: none; background: none; cursor: pointer;" data-cursor-hover>
            Forgot your password?
          </button>
        </form>

        <!-- Post-Auth Redirect State -->
        <div id="auth-signed-in" style="display: none; text-align: center; padding: var(--space-6) 0;">
          <p style="color: var(--status-success); margin-bottom: var(--space-4);">You are already signed in!</p>
          <div style="display: flex; gap: var(--space-4); justify-content: center; flex-wrap: wrap;">
            <a class="btn btn--primary" href="/frontend/pages/profile.html" data-cursor-hover>My Profile</a>
            <a class="btn btn--ghost" href="/frontend/pages/connect.html" data-cursor-hover>Client Portal</a>
          </div>
        </div>
      </div>
    </section>
